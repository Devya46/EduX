<!-- ----footer----- -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDU Stockx – Footer Pro</title>
    <!-- Font Awesome 6 (free) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .body-footer {
        background: #0b0b0b;
        /* font-family: "Inter", Arial, sans-serif; */
        /* min-height: 100vh; */
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      /* ----- footer main ----- */
      .foot-footer {
        background: #0f0f0f;
        color: #fff;
        padding: 60px 40px 30px;
        border-top: 1px solid #2a2a2a;
      }

      .foot-container {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 2.4fr 1fr 1fr 1.2fr;
        gap: 50px 60px;
        padding: 0 2rem;
      }

      /* ----- left column (logo + belief) ----- */
      .foot-left {
        display: flex;
        flex-direction: column;
      }

      .foot-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }

      .foot-logo-img {
        width: 60px;
        height: 68px;
        object-fit: contain;
        filter: brightness(1.05);
        display: block;
        flex-shrink: 0;
      }

      .foot-brand-name {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.3px;
        color: #ffffff;
        line-height: 1.2;
      }
      .foot-brand-name span {
        color: goldenrod;
        font-weight: 400;
      }

      .foot-belief {
        margin: 6px 0 18px 0;
        font-size: 17px;
        line-height: 1.6;
        color: #d0d0d0c9;
        max-width: 420px;
        font-weight: 400;
        letter-spacing: 0.2px;
        padding-left: 18px;
        border-left: 3px solid #3a3a3a;
        font-style: italic;
      }
      .foot-belief i {
        color: #b0b0b0;
        margin-right: 4px;
      }

      /* social icons row (left column) */
      .foot-social-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        margin-top: 6px;
      }

      .foot-social-row a {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 20px;
        text-decoration: none;
        transition:
          transform 0.2s ease,
          opacity 0.2s,
          box-shadow 0.2s;
        background: #1e1e1e;
        border: 1px solid #333;
      }

      .foot-social-row a:hover {
        transform: scale(1.08);
        opacity: 0.95;
        box-shadow: 0 0 0 2px #3f3f3f;
      }

      /* brand colors for icons */
      .foot-social-row .foot-fb {
        background: #1877f2;
        border-color: #1877f2;
      }
      .foot-social-row .foot-ig {
        background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
        border-color: transparent;
      }
      .foot-social-row .foot-yt {
        background: #ff0000;
        border-color: #ff0000;
      }
      .foot-social-row .foot-tg {
        background: #0088cc;
        border-color: #0088cc;
      }
      .foot-social-row .foot-dc {
        background: #5865f2;
        border-color: #5865f2;
      }

      /* ----- headings & links (company, services, more) ----- */
      .foot-heading {
        font-size: 15px;
        margin-bottom: 24px;
        font-weight: 700;
        letter-spacing: 0.6px;
        color: #f0f0f0;
        text-transform: uppercase;
        opacity: 0.8;
      }

      .foot-links a {
        display: block;
        color: #c5c5c5;
        text-decoration: none;
        font-size: 16px;
        margin-bottom: 16px;
        transition:
          color 0.2s ease,
          padding-left 0.15s;
        font-weight: 400;
      }

      .foot-links a:hover {
        color: #ffffff;
        padding-left: 4px;
      }

      /* ----- bottom bar (copyright + credit) ----- */
      .foot-bottom {
        max-width: 1400px;
        margin: 30px auto 0;
        padding-top: 22px;
        border-top: 1px solid #2a2a2a;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        color: #b0b0b0;
        padding-left: 2rem;
        padding-right: 2rem;
      }

      .foot-bottom .foot-copy a {
        color: goldenrod;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
      }
      .foot-bottom .foot-copy a:hover {
        color: #aaa;
      }

      .foot-bottom .foot-credit a {
        color: goldenrod;
        text-decoration: none;
        font-weight: 400;
        border-bottom: 1px dotted #555;
        transition:
          color 0.2s,
          border-color 0.2s;
      }
      .foot-bottom .foot-credit a:hover {
        color: #ddd;
        border-bottom-color: #aaa;
      }

      /* ----- responsive: 2 columns in a row (tablet) ----- */
      @media (max-width: 1100px) {
        .foot-container {
          grid-template-columns: 1fr 1fr;
          gap: 40px 30px;
          padding: 0 0.5rem;
        }
        .foot-left {
          grid-column: 1 / -1;
        }
        .foot-belief {
          max-width: 100%;
        }
      }

      /* small screens: single column */
      /* Mobile */
      @media (max-width: 700px) {
        .foot-footer {
          padding: 40px 20px 25px;
        }

        .foot-container {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 30px 20px;
          padding: 0;
        }

        /* Logo section full width */
        .foot-left {
          grid-column: 1 / -1;
        }

        /* Company & Services side by side */
        .foot-container > .foot-links:nth-child(2),
        .foot-container > .foot-links:nth-child(3) {
          grid-column: auto;
        }

        /* More section full width */
        .foot-container > .foot-links:nth-child(4) {
          grid-column: 1 / -1;
        }

        .foot-brand-name {
          font-size: 24px;
        }

        .foot-social-row a {
          width: 44px;
          height: 44px;
          font-size: 18px;
        }

        .foot-bottom {
          flex-direction: column;
          gap: 12px;
          text-align: center;
          margin-top: 30px;
          padding-top: 18px;
          padding-left: 0;
          padding-right: 0;
        }

        .foot-belief {
          padding-left: 14px;
          font-size: 16px;
        }
      }

      @media (max-width: 450px) {
        .foot-brand {
          flex-wrap: wrap;
        }
        .foot-logo-img {
          width: 48px;
          height: 48px;
        }
        .foot-brand-name {
          font-size: 20px;
        }
      }

      /* fix for X icon (Font Awesome 6) */
      .fa-x-twitter::before {
        content: "\e9ca";
        font-family: "Font Awesome 6 Brands";
      }
    </style>
  </head>
  <body>
    <div class="body-footer">
      <footer class="foot-footer">
        <div class="foot-container">
          <!-- LEFT column: logo + name + belief + socials -->
          <div class="foot-left">
            <div class="foot-brand">
              <!-- replace src with your actual logo path -->
              <img
                class="foot-logo-img"
                src="../images/logo_cut.png"
                alt="EDU Stockx logo"
              />
              <span class="foot-brand-name">EDU<span>Stockx</span></span>
            </div>

            <div class="foot-belief">
              <i
                class="fas fa-quote-left"
                style="opacity: 0.5; font-size: 14px"
              ></i>
              Anyone can copy a strategy, but they cannot copy the mindset
              behind it.
            </div>

            <!-- Social icons (left column) : youtube, telegram, discord, instagram, facebook -->
            <div class="foot-social-row">
              <a href="#" class="foot-yt" aria-label="YouTube"
                ><i class="fab fa-youtube"></i
              ></a>
              <a href="#" class="foot-tg" aria-label="Telegram"
                ><i class="fab fa-telegram-plane"></i
              ></a>
              <a href="#" class="foot-dc" aria-label="Discord"
                ><i class="fab fa-discord"></i
              ></a>
              <a href="#" class="foot-ig" aria-label="Instagram"
                ><i class="fab fa-instagram"></i
              ></a>
              <a href="#" class="foot-fb" aria-label="Facebook"
                ><i class="fab fa-facebook-f"></i
              ></a>
            </div>
          </div>

          <!-- COMPANY -->
          <div class="foot-links">
            <h3 class="foot-heading">COMPANY</h3>
            <a href="../About.html">About Us</a>
            <a href="../Contact.html">Contact Us</a>
            <a href="../Pricing.html">Pricing</a>
            <a href="../FAQ.html">FAQ</a>
          </div>

          <!-- SERVICES (second column) -->
          <div class="foot-links">
            <h3 class="foot-heading">SERVICES</h3>
            <a href="Gold.html">Future Trading</a>
            <a href="crypto.html">Crypto Trading</a>
            <a href="stocks.html">Stocks Trading</a>
          </div>

          <!-- MORE (third column) -->
          <div class="foot-links">
            <h3 class="foot-heading">MORE</h3>
            <a href="../terms.html">Terms of Service</a>
            <a href="../Privacy.html">Privacy Policy</a>
          </div>
        </div>

        <!-- BOTTOM BAR -->
        <div class="foot-bottom">
          <div class="foot-copy">
            &copy; 2026 <a href="https://edustockx.com/">EDU Stockx</a> — All
            Rights Reserved
          </div>
          <div class="foot-credit">
            Designed by
            <a
              href="https://skilled-va.com/"
              target="_blank"
              rel="noopener noreferrer"
              >Skilled VA</a
            >
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
